name: Postman API Tests

on:
  push:
    branches: [main]
    paths:
      - "api-testing/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-testing/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postman-cli:
    name: Postman collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection
        run: npm run test:api

      - name: Upload Postman CLI JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-cli-report
          path: api-testing/reports/postman-cli-report.json
          retention-days: 30
